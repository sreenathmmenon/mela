name: Deploy Mela frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
        env:
          VITE_SPACETIMEDB_HOST: https://maincloud.spacetimedb.com
          VITE_SPACETIMEDB_DB_NAME: mela-cah23
          VITE_PUBLIC_APP_URL: https://sreenathmenon.com/mela
          VITE_GOATCOUNTER_CODE: mela
          VITE_OPERATOR_KEY: c2a37472828084964c76d019
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
