    <style>
      /* Painted before any JavaScript runs, so a cold load is never a blank
         screen. #boot is removed by the app as soon as React mounts. */
      html,
      body {
        margin: 0;
        background: #f7f8fc;
        color: #221b10;
        font-family:
          "DM Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        text-align: center;
        background: #f7f8fc;
      }
      #boot h1 {
        margin: 0;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0;
        color: #1b2340;
      }
      #boot p {
        margin: 0;
        max-width: 30ch;
        color: #647086;
        font-size: 14px;
        line-height: 1.5;
      }
      /* Three festival lamps warming up. */
      #boot span {
        display: flex;
        gap: 11px;
      }
      #boot span i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4258ed;
        border: 0;
        animation: boot-lamp 1s ease-in-out infinite;
      }
      #boot span i:nth-child(2) {
        animation-delay: 0.16s;
      }
      #boot span i:nth-child(3) {
        animation-delay: 0.32s;
      }
      @keyframes boot-lamp {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span i {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <h1>Mela</h1>
      <p>Getting your games ready…</p>
      <span aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
